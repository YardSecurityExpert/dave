name: Verify Dave
on:
  push:
    paths:
      - 'dave-app/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'dave-app/**'
      - '.github/workflows/verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dave-app
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dave-app/package-lock.json
      - run: npm ci
      - run: npm run verify
